name: Continuous integration
on:
  push:
    branches:
      - develop
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: check out code
        uses: actions/checkout@v7
      - name: set up golang
        uses: actions/setup-go@v7
        with:
          go-version: 1.26
      - run: go version
      - name: unit test
        run: go test -covermode=atomic -coverprofile=profile.cov -v ./...
  call-build-deploy:
    needs: test
    uses: dictyBase/workflows/.github/workflows/composite-deploy.yaml@develop
    secrets: inherit
    with:
      app: dcr-mcp
      project: dcr-mcp
      stack: experiments
      repository: ${{ github.repository }}
      ref: ${{ github.ref_name }}
      dockerfile: build/package/Dockerfile 
      docker_image: dcr-mcp
      cluster: ${{ vars.DEV_STAGING_CLUSTER }}
      cluster_state_storage: ${{ vars.DEV_STAGING_KOPS_STATE_STORAGE }}
